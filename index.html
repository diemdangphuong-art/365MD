    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {
          // Ignore if non-configurable in this frame
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var filename = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              filename.indexOf('chrome-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        try {
          // Polyfill tương thích trình duyệt trên PC Windows 7 (Chrome 87-109, Edge 109, Cốc Cốc, Firefox ESR)
          if (!Object.hasOwn) {
            Object.hasOwn = function (obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }
          if (!Array.prototype.at) {
            Array.prototype.at = function (n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }
          if (!String.prototype.at) {
            String.prototype.at = function (n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this.charAt(n);
            };
          }
          if (typeof window.structuredClone !== 'function') {
            window.structuredClone = function (val) {
              return JSON.parse(JSON.stringify(val));
            };
          }
        } catch (_polyErr) {
          // Ignore polyfill errors
        }

        try {
          // Luôn gỡ bỏ Service Worker cũ lưu đệm giao diện cũ trên PC (quanly365md.com) & Điện thoại (iOS/Android)
          var SW_SECURITY_VER = '365md_security_lockdown_v25';
          var hadController = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var unregisteredAny = false;
              var promises = [];
              for (var i = 0; i < regs.length; i++) {
                unregisteredAny = true;
                promises.push(regs[i].unregister());
              }
              Promise.all(promises).then(function () {
                if ((unregisteredAny || hadController) && window.sessionStorage && !sessionStorage.getItem(SW_SECURITY_VER)) {
                  sessionStorage.setItem(SW_SECURITY_VER, '1');
                  window.location.reload();
                }
              });
            });
          }

          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }

          if (window.localStorage) {
            // Luôn xóa phiên đăng nhập tự động & mật khẩu lưu đệm khi mở trình duyệt
            localStorage.removeItem('365md_v5_kiotviet_active_staff_id');
            localStorage.removeItem('365md_auto_save_login_session');
            localStorage.removeItem('365md_v8_kiotviet_credentials');
            localStorage.removeItem('365md_v7_kiotviet_credentials');
            localStorage.removeItem('365md_v6_kiotviet_credentials');

            if (localStorage.getItem('365md_sw_ver') !== SW_SECURITY_VER) {
              localStorage.setItem('365md_sw_ver', SW_SECURITY_VER);
              localStorage.removeItem('365md_v5_kiotviet_products');
              localStorage.removeItem('365md_v7_kiotviet_products');
              localStorage.removeItem('365md_v6_kiotviet_staff_pub');
              localStorage.removeItem('365md_v9_kiotviet_staff_pub');
              localStorage.removeItem('365md_v10_kiotviet_staff_pub');
              localStorage.removeItem('365md_v11_kiotviet_staff_pub');
              localStorage.removeItem('365md_v12_kiotviet_staff_pub');
            }
          }
        } catch (_err) {
          // Ignore storage/SW errors
        }
      })();
    </script>
